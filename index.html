<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adapt or Vanish: An Ecosystem Survival Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF2F0; --surface:#FFFFFF; --ink:#16303F; --muted:#4D6571; --line:#C4D7D3; --grid:rgba(22,48,63,.07);
  --leaf:#1F7650; --leaf-soft:#D3EEDF; --harm:#B3264B; --harm-soft:#F8DCE3;
  --mark:#F5D547; --mark-ink:#16303F;
  --phys:#2462A8; --phys-soft:#DCE8F7; --behav:#6A48B8; --behav-soft:#E8E0FA;
  --btn:#16303F; --btn-ink:#F4FAF8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1B22; --surface:#14292F; --ink:#E3EEEA; --muted:#9BB3BA; --line:#294650; --grid:rgba(227,238,234,.05);
    --leaf:#5FCB99; --leaf-soft:#173D2E; --harm:#FF7E9D; --harm-soft:#47202B;
    --phys:#86B9F2; --phys-soft:#1B3350; --behav:#BCA7FF; --behav-soft:#2E2550;
    --btn:#E3EEEA; --btn-ink:#0D1B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1B22; --surface:#14292F; --ink:#E3EEEA; --muted:#9BB3BA; --line:#294650; --grid:rgba(227,238,234,.05);
  --leaf:#5FCB99; --leaf-soft:#173D2E; --harm:#FF7E9D; --harm-soft:#47202B;
  --phys:#86B9F2; --phys-soft:#1B3350; --behav:#BCA7FF; --behav-soft:#2E2550;
  --btn:#E3EEEA; --btn-ink:#0D1B22;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font:400 1.0625rem/1.6 "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
}
h1,h2,h3{font-family:"Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif; line-height:1.1; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:clamp(2.8rem,9vw,5.2rem); font-weight:800}
h2{font-size:clamp(1.7rem,4.5vw,2.4rem); font-weight:800}
h3{font-size:1.25rem; font-weight:600}
h2:focus{outline:none}
p{margin:0 0 1em; max-width:68ch}
img,svg{max-width:100%}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 20px; max-width:1080px; margin:0 auto}
.brand{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:1.1rem}
.brand span{display:inline-block; transform:rotate(-8deg)}
main{max-width:1080px; margin:0 auto; padding:8px 20px 64px}
button{font:inherit; cursor:pointer}
.btn{background:var(--btn); color:var(--btn-ink); border:0; border-radius:999px; padding:.8em 1.6em; font-weight:700; font-size:1.05rem}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4; cursor:not-allowed; filter:none}
.btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:.55em 1.1em; font-weight:700}
.btn-ghost:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--mark); outline-offset:3px}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.muted{color:var(--muted)}
.small{font-size:.92rem}

/* Title */
.hero{display:grid; grid-template-columns:1.1fr .9fr; gap:32px; align-items:center; padding:24px 0 8px}
.hero h1{margin-bottom:.25em}
.hero h1 .line2{display:block; color:var(--harm); padding-left:.5em}
.hero .lede{font-size:1.2rem}
.steps{list-style:none; padding:0; margin:24px 0; display:grid; gap:10px; counter-reset:s}
.steps li{counter-increment:s; display:flex; gap:12px; align-items:baseline}
.steps li::before{content:counter(s); font-family:"Bricolage Grotesque",sans-serif; font-weight:800; background:var(--mark); color:var(--mark-ink); width:1.8em; height:1.8em; border-radius:50%; display:inline-grid; place-items:center; flex:none}
.sol{margin-top:28px; padding-top:14px; border-top:2px dashed var(--line); font-size:.92rem; color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .critter-frame{order:-1; max-width:360px}}

/* Cards / panels */
.panel{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:20px}
.eco-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; margin-top:12px}
.eco-group{margin-top:28px; font-size:1.5rem}
.eco-card{display:flex; flex-direction:column; gap:10px; border-radius:18px; overflow:hidden; background:var(--surface); border:2px solid var(--line)}
.eco-card .art{height:110px}
.eco-card .body{padding:4px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1}
.eco-card ul{margin:0; padding-left:1.2em}
.eco-card .btn{margin-top:auto; align-self:flex-start}
.kind{font-weight:700; color:var(--muted); font-size:.95rem}
.factor-h{font-weight:700; margin-top:6px}
.factor-h.abiotic{color:var(--phys)} .factor-h.biotic{color:var(--leaf)}

/* Design screen */
.design{display:grid; grid-template-columns:1fr 340px; gap:28px; align-items:start}
.design aside{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.design{grid-template-columns:1fr}.design aside{position:static; order:-1}}
fieldset{border:0; padding:0; margin:0 0 26px}
legend{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:0; margin-bottom:4px}
legend h3{margin:0}
.q{margin:0 0 10px; color:var(--muted)}
.tag{display:inline-block; font-size:.82rem; font-weight:700; padding:.15em .7em; border-radius:999px}
.tag.Physical{background:var(--phys-soft); color:var(--phys)}
.tag.Behavioral{background:var(--behav-soft); color:var(--behav)}
.tag.Abiotic{background:var(--phys-soft); color:var(--phys)}
.tag.Biotic{background:var(--leaf-soft); color:var(--leaf)}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px}
.opts.four{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.observe{margin-top:14px; padding:12px 14px; border-radius:12px; border:2px dashed var(--harm); background:var(--harm-soft)}
.callouts{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:14px}
.callouts .panel b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-size:1.15rem}
.opt{position:relative; display:block}
.opt input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.opt span{display:block; height:100%; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:12px 14px; transition:border-color .15s, background .15s}
.opt b{display:block}
.opt small{display:block; color:var(--muted); font-size:.9rem; line-height:1.4; margin-top:2px}
.opt input:checked + span{border-color:var(--ink); background:var(--mark); color:var(--mark-ink)}
.opt input:checked + span small{color:var(--mark-ink)}
.opt input:focus-visible + span{outline:3px solid var(--phys); outline-offset:2px}
.opt:hover span{border-color:var(--ink)}
.name-input{font:inherit; font-size:1.1rem; padding:.6em .8em; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink); width:100%; max-width:360px}
.name-input:focus-visible{border-color:var(--ink)}
.critter-frame{border-radius:18px; overflow:hidden; border:2px solid var(--line); background:var(--surface)}
.critter-frame svg{display:block; width:100%; height:auto}
.critter-cap{padding:12px 16px}
.critter-cap h3{margin:0 0 6px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips .tag{font-weight:400}
details.cheat{margin-bottom:22px}
details.cheat summary{cursor:pointer; font-weight:700}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px}
.two-col ul{margin:4px 0 0; padding-left:1.2em}
@media (max-width:560px){.two-col{grid-template-columns:1fr}}

/* Game screens */
.status{display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; margin-bottom:18px; font-weight:700}
.gen-track{display:flex; gap:5px}
.gen-track i{width:22px; height:10px; border-radius:5px; background:var(--line)}
.gen-track i.done{background:var(--ink)}
.gen-track i.now{background:var(--mark); outline:2px solid var(--ink)}
.play{display:grid; grid-template-columns:1fr 300px; gap:28px; align-items:start}
@media (max-width:820px){.play{grid-template-columns:1fr}.play aside{max-width:360px}}
.event-card{background:var(--surface); border:2px solid var(--ink); border-radius:20px; padding:24px; box-shadow:6px 6px 0 var(--line)}
.event-emoji{font-size:3.4rem; line-height:1; margin-bottom:8px}
.event-card h2{margin-top:6px}
.predict{margin-top:20px; padding-top:16px; border-top:2px dashed var(--line)}
.predict p{font-weight:700}
.bignum{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:clamp(2.4rem,7vw,3.6rem); line-height:1}
.delta.up{color:var(--leaf)} .delta.down{color:var(--harm)}
.popbar{height:14px; background:var(--line); border-radius:7px; overflow:hidden; margin:10px 0 4px; max-width:520px}
.popbar i{display:block; height:100%; background:var(--leaf); border-radius:7px; transition:width .8s ease}
.effects{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:8px}
.effects li{padding:8px 12px; border-radius:10px; display:flex; gap:10px; align-items:baseline}
.effects li.help{background:var(--leaf-soft)} .effects li.hurt{background:var(--harm-soft)}
.effects li .icon{font-weight:800; flex:none}
.effects li.help .icon{color:var(--leaf)} .effects li.hurt .icon{color:var(--harm)}
.factor-line{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.factor-line:last-of-type{border-bottom:0}
.pct{font-weight:800}
.pct.up{color:var(--leaf)} .pct.down{color:var(--harm)}
.note{background:var(--mark); color:var(--mark-ink); padding:12px 16px; border-radius:12px; font-weight:700}

/* Mutation */
.mut-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin:20px 0}
.mut-card .tag{align-self:flex-start}
.mut-card{text-align:left; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:8px}
.mut-card:hover{border-color:var(--ink); box-shadow:5px 5px 0 var(--line)}
.mut-card .mut-name{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:1.25rem; line-height:1.15}
.mut-card .swap{color:var(--muted)}
.mut-card .pick{margin-top:auto; font-weight:700; text-decoration:underline; text-underline-offset:3px}
.aside-note{border-left:5px solid var(--behav); padding:6px 0 6px 14px; color:var(--muted)}

/* End */
.outcome{border-radius:22px; padding:26px; border:2px solid var(--ink); background:var(--surface); box-shadow:6px 6px 0 var(--line); margin-bottom:28px}
.outcome .bignum{font-size:clamp(2.6rem,8vw,4.4rem)}
.outcome.thriving .bignum{color:var(--leaf)}
.outcome.extinct .bignum,.outcome.endangered .bignum{color:var(--harm)}
.chart-wrap{overflow-x:auto}
.report{width:100%; border-collapse:collapse; min-width:560px}
.report th,.report td{text-align:left; padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
.report th{font-size:.92rem; color:var(--muted)}
.verdict{font-weight:800; white-space:nowrap}
.verdict.help{color:var(--leaf)} .verdict.hurt{color:var(--harm)} .verdict.meh{color:var(--muted)}
.table-wrap{overflow-x:auto}
.section{margin-top:34px}
.journal{padding-left:1.4em}
.journal li{margin-bottom:6px}
textarea.report-text{width:100%; min-height:200px; font:inherit; font-size:.95rem; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink)}
.ideal{margin-top:12px}
.ideal summary{cursor:pointer; font-weight:700}

/* Glossary */
dialog{border:2px solid var(--ink); border-radius:18px; padding:0; max-width:620px; width:calc(100% - 32px); background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(10,20,25,.55)}
.dlg-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:2px solid var(--line)}
.dlg-head h2{margin:0; font-size:1.6rem}
.dlg-body{padding:8px 20px 20px; max-height:65vh; overflow:auto}
.dlg-body dt{font-weight:700; margin-top:12px}
.dlg-body dd{margin:2px 0 0}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span aria-hidden="true">🦎</span> Adapt or Vanish</div>
  <button class="btn-ghost" id="openGlossary" type="button">Word bank</button>
</header>
<main id="app" aria-live="polite"></main>

<dialog id="glossary" aria-labelledby="glossTitle">
  <div class="dlg-head"><h2 id="glossTitle">Word bank</h2><button class="btn-ghost" type="button" id="closeGlossary">Close</button></div>
  <div class="dlg-body"><dl id="glossList"></dl></div>
</dialog>

<script>
"use strict";
const CAP = 1000, START = 100, GENS = 8, MUT_AFTER = [1, 3, 5, 7];

const GLOSSARY = [
  ["Adaptation", "An inherited trait that helps an organism survive and reproduce in its environment."],
  ["Physical adaptation", "A body feature that helps an organism survive, like thick fur, gills, or camouflage coloring."],
  ["Behavioral adaptation", "Something an organism does that helps it survive, like hunting at night, migrating, or living in a group. Many of these are inherited instincts."],
  ["Ecosystem", "All the living and nonliving things in an area and how they interact."],
  ["Abiotic factor", "A nonliving part of an ecosystem, like temperature, water, sunlight, salt, oxygen, or soil."],
  ["Biotic factor", "A living part of an ecosystem, like plants, predators, prey, or competitors."],
  ["Trait", "A characteristic of an organism, like color, body shape, or behavior."],
  ["Gene / genetic", "Genes are sections of DNA that carry the instructions for traits. Genetic traits are passed from parents to offspring."],
  ["Mutation", "A change in an organism’s DNA. Mutations can create new traits. Some help, some harm, and many have no effect."],
  ["Variation", "Differences in traits among members of the same species."],
  ["Natural selection", "The process where individuals with helpful traits survive and reproduce more, so those traits become more common over generations."],
  ["Population", "All the members of one species living in the same area."],
  ["Generation", "One step in a family line, like parents to children. Each round of this game is one generation."],
  ["Camouflage", "Coloring or patterns that help an organism blend in with its surroundings."],
  ["Nocturnal / diurnal", "Nocturnal animals are active at night. Diurnal animals are active during the day."],
  ["Dormancy", "A deep, inactive sleep that saves energy during harsh times. Hibernation is dormancy in winter; estivation is dormancy during hot, dry times."],
  ["Streamlined", "Having a smooth shape that moves easily through water or air."],
  ["Competition", "When organisms struggle for the same limited resources, like food, water, or shelter."]
];

const ECOS = {
  desert: { id:"desert", i:0, land:true, name:"Sunscorch Desert", kind:"Land ecosystem", emoji:"🏜️",
    blurb:"A dry, sandy landscape where rain almost never falls.",
    abiotic:["Very hot days, up to 50°C (122°F)", "Cold nights, sometimes below freezing", "Very little water; rain is rare", "Loose sand and strong sunlight"],
    biotic:["Hawks that hunt during the day", "Snakes that hunt at night", "Cactus, shrubs, and seeds", "Insects and seed-eating rodents"] },
  reef: { id:"reef", i:1, land:false, name:"Turquoise Coral Reef", kind:"Marine (saltwater) ecosystem", emoji:"🪸",
    blurb:"A warm, shallow ocean reef built by tiny coral animals.",
    abiotic:["Warm, salty ocean water", "Bright sunlight in shallow water", "Clear water with strong currents", "Oxygen dissolved in the water"],
    biotic:["Colorful coral full of hiding spots", "Sharks and moray eels", "Huge schools of competing fish", "Algae and floating plankton to eat"] },
  pond: { id:"pond", i:2, land:false, name:"Willow Pond", kind:"Freshwater ecosystem", emoji:"🪷",
    blurb:"A quiet freshwater pond ringed by cattails and willow trees.",
    abiotic:["Fresh (not salty) water", "Freezes in winter, warms up in summer", "Oxygen can run low in hot weather", "Soft mud on the bottom"],
    biotic:["Herons that wade and hunt by day", "Bass and other hungry fish", "Cattails, algae, and water plants", "Insects, snails, and crayfish"] },
  forest: { id:"forest", i:3, land:true, name:"Maplewood Forest", kind:"Land ecosystem (deciduous forest)", emoji:"🌳",
    blurb:"A shady forest of oak and maple trees that drop their leaves each fall, like the forests of Virginia’s Blue Ridge.",
    abiotic:["Four seasons: snowy winters, warm humid summers", "Plenty of rain all year", "Shady forest floor covered in fallen leaves", "Rich soil, logs, and rocks"],
    biotic:["Hawks by day and owls by night", "Foxes that hunt on the forest floor", "Oak trees, acorns, berries, and mushrooms", "Squirrels and deer competing for food"] },
  arctic: { id:"arctic", i:4, land:true, name:"Frostbite Tundra", kind:"Land ecosystem (arctic tundra)", emoji:"❄️",
    blurb:"A cold, treeless plain near the North Pole, covered in snow for most of the year.",
    abiotic:["Below freezing most of the year, down to −30°C (−22°F)", "Snow and ice; the ground stays frozen (permafrost)", "Weeks of darkness in winter, nearly 24-hour daylight in summer", "Strong, icy winds"],
    biotic:["Arctic foxes, wolves, and snowy owls", "Mosses, lichens, and low shrubs", "Lemmings and caribou competing for plants", "A short summer burst of insects and berries"] },
  grassland: { id:"grassland", i:5, land:true, name:"Golden Prairie", kind:"Land ecosystem (grassland)", emoji:"🌾",
    blurb:"Wide, open land covered in tall grass, with almost no trees to hide behind.",
    abiotic:["Hot summers and cold, windy winters", "Medium rainfall with dry spells", "Wildfires that sweep across the grass", "Open land with deep soil, few trees"],
    biotic:["Hawks and eagles hunting by day", "Coyotes that hunt at night", "Tall grasses and wildflowers", "Bison, prairie dogs, and grasshoppers"] }
};

// s = fitness score in [desert, reef, pond, forest, arctic, grassland]; why = explanation for each ecosystem
const TRAITS = [
  { id:"breathing", label:"Breathing", type:"Physical", q:"How does your species get oxygen?", options:[
    { id:"gills", name:"Gills", desc:"Pull oxygen out of water.", s:[-20,3,2,-20,-20,-20], why:[
      "Gills only work in water. In dry desert air they collapse and can’t take in oxygen.",
      "Gills pull dissolved oxygen out of seawater, which is exactly what the reef offers.",
      "Gills work in pond water, but warm summer water can run low on oxygen.",
      "Gills only work in water. Forest air is damp, but gills still can’t pull oxygen from it.",
      "Gills need liquid water, and the tundra’s water is frozen most of the year.",
      "Gills only work in water, and the prairie is dry, open land." ]},
    { id:"lungs", name:"Lungs", desc:"Breathe oxygen from the air.", s:[3,-3,-1,3,3,3], why:[
      "Lungs are built for breathing air, and air is what the desert has.",
      "An air-breather has to swim to the surface again and again, which wastes energy and attracts predators.",
      "Surfacing for air often makes your species easier for predators to spot.",
      "Lungs are built for breathing air, which is exactly what the forest has.",
      "Lungs breathe air, which is what the tundra has, even if it’s freezing.",
      "Lungs are the right tool for breathing air on open land." ]},
    { id:"both", name:"Gills + simple lungs", desc:"Breathes in water or gulps air.", s:[-2,1,3,-2,-3,-2], why:[
      "The gills dry out in the desert, so half of this system is useless and needs moisture to survive.",
      "The gills do the work here; the lungs are rarely needed in the open ocean.",
      "Pond oxygen levels change with the seasons. Breathing both ways, like a lungfish, is a big advantage.",
      "The gills need water. The damp forest floor helps a little, but they’re mostly wasted.",
      "Frozen water and icy air make the gills useless, and they’re easily damaged by cold.",
      "The gills dry out on the grassland, so half of this system is wasted." ]}
  ]},
  { id:"covering", label:"Body covering", type:"Physical", q:"What covers your species’ body?", options:[
    { id:"fur", name:"Thick fur", desc:"Traps heat to keep the body warm.", s:[0,-3,-2,2,3,1], why:[
      "Fur protects against cold desert nights, but it also causes overheating in the daytime. It’s a trade-off.",
      "Fur gets soaked and heavy in the ocean, and wet fur doesn’t keep a small animal warm.",
      "Wet fur is heavy and slow to dry, which is a problem for an animal that lives in water.",
      "Fur keeps your species warm through snowy forest winters.",
      "Thick fur traps body heat, a must where it stays below freezing for months, like an arctic fox or polar bear.",
      "Fur helps through cold, windy prairie winters, but it can be hot in summer." ]},
    { id:"scales", name:"Tough, waxy scales", desc:"Hold water in and protect the skin.", s:[3,1,1,1,-2,1], why:[
      "Waxy scales keep water from escaping the body, a key adaptation where water is scarce.",
      "Scales protect against scrapes from sharp coral.",
      "Scales give some protection from rough plants and rocks.",
      "Scales give some protection from thorns and bites.",
      "Scales don’t trap heat, so a scaly animal loses warmth quickly in freezing cold.",
      "Scales hold water in during dry, windy summers but don’t help in cold winters." ]},
    { id:"slimy", name:"Thin, slimy skin", desc:"Stays moist and can absorb some oxygen.", s:[-3,1,2,1,-3,-2], why:[
      "Thin, moist skin loses water quickly in hot, dry air.",
      "Slimy mucus helps protect the skin from parasites on the reef.",
      "Moist skin absorbs extra oxygen from fresh water, like many frogs and salamanders.",
      "The damp forest floor keeps thin skin moist, like the salamanders that live under logs.",
      "Thin, wet skin freezes and loses heat fast in icy wind.",
      "Dry prairie winds pull water out of thin skin." ]}
  ]},

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const shuffle = arr => { const a = [...arr]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const traitDef = id => TRAITS.find(t => t.id === id);
const optDef = (cat, id) => traitDef(cat).options.find(o => o.id === id);
const fmtPct = x => (x >= 0 ? "+" : "−") + Math.abs(Math.round(x*100)) + "%";

let state;
function freshState(ecoId){
  return { screen: ecoId ? "design" : "title", eco: ecoId || null, name:"", traits:{}, extras:[],
    pop:START, gen:0, history:[START], events:[], journal:[], mutations:[], last:null, offer:null,
    predictions:0, correct:0, extinctGen:null };
}
state = freshState();

function has(key){
  if (key.startsWith("x:")) return state.extras.includes(key.slice(2));
  const [c,o] = key.split(":"); return state.traits[c] === o;
}
function ecoIndex(){ return ECOS[state.eco].i; }
function fitScore(){
  const i = ecoIndex(); let f = 0;
  TRAITS.forEach(t => { const o = state.traits[t.id]; if (o) f += optDef(t.id, o).s[i]; });
  state.extras.forEach(x => f += EXTRAS[x].s[i]);
  return f;
}
function fitWords(f){
  if (f >= 12) return "an excellent match";
  if (f >= 6) return "a good match";
  if (f >= 0) return "an okay match";
  if (f >= -6) return "a poor match";
  return "a terrible match";
}
function speciesName(){ return state.name.trim() || "Species X"; }
function rankedTraits(){
  const i = ecoIndex(), list = [];
  TRAITS.forEach(t => { const o = state.traits[t.id]; if (o) { const d = optDef(t.id, o); list.push({ name:d.name, label:t.label, score:d.s[i] }); } });
  state.extras.forEach(x => list.push({ name:EXTRAS[x].name, label:"Mutation", score:EXTRAS[x].s[i] }));
  return list.sort((a,b) => a.score - b.score);
}

/* ---------- critter drawing ---------- */
let svgId = 0;
function critterSVG(traits, extras, eco, sceneOnly){
  const id = "c" + (svgId++);
  const hasX = x => extras.includes(x);
  const palettes = { tan:["#D8B275","#A47C40"], bright:["#FF8A3D","#2F6FD6"], dark:["#5B7840","#33482A"], white:["#F7FAFC","#9AA9B5"], none:["#C3CDCA","#8C9895"] };
  let [fill, accent] = palettes[traits.color || "none"];
  if (hasX("pale")) { fill = "#F4EFE7"; accent = "#D6CBBD"; }
  const bgs = { desert:["#FBE3B0","#EDBB72"], reef:["#9BDDF0","#2A86B3"], pond:["#B9DFB0","#4C8A66"], forest:["#CFE6C2","#55804A"], arctic:["#EEF6FB","#B6D2E6"], grassland:["#FBEFB8","#D2AE52"] };
  const [bg1, bg2] = bgs[eco] || ["#E3ECEA","#B9C8C4"];
  const shape = traits.shape;
  const cx = 112; let cy = 86, rx = 44, ry = 30;
  if (shape === "smallears") { rx = 36; ry = 27; cy = 90; }
  if (shape === "large") { rx = 54; ry = 40; cy = 82; }
  if (shape === "fins") { rx = 60; ry = 22; cy = 80; }
  const p = [];
  // scenery
  let scene = "";
  if (eco === "desert") scene = `<ellipse cx="110" cy="150" rx="160" ry="34" fill="#E2A95A" opacity=".7"/><path d="M22 128 v-26 m0 10 h-8 v-10 m8 4 h8 v-12" stroke="#4E8A4E" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="182" cy="26" r="13" fill="#FFF3C4"/>`;
  if (eco === "reef") scene = `<path d="M0 140 Q30 118 50 140 Z" fill="#FF7FA8"/><path d="M168 140 v-24 m0 8 l-10 -10 m10 16 l12 -14" stroke="#F7B43A" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="30" cy="30" r="4" fill="#fff" opacity=".6"/><circle cx="40" cy="44" r="3" fill="#fff" opacity=".5"/>`;
  if (eco === "forest") scene = `<rect y="128" width="220" height="24" fill="#7A5A32" opacity=".55"/><rect x="14" y="40" width="10" height="92" fill="#6B4A2A"/><circle cx="19" cy="40" r="24" fill="#2F6B3F"/><rect x="190" y="30" width="10" height="102" fill="#6B4A2A"/><circle cx="195" cy="30" r="26" fill="#3C7D46"/><circle cx="170" cy="134" r="5" fill="#C0392B"/><circle cx="160" cy="137" r="4" fill="#C0392B"/>`;
  if (eco === "arctic") scene = `<ellipse cx="110" cy="150" rx="170" ry="32" fill="#FFFFFF"/><path d="M0 122 L28 96 L50 122 Z M160 122 L186 92 L214 122 Z" fill="#DCEBF5"/><circle cx="36" cy="26" r="2" fill="#fff"/><circle cx="70" cy="16" r="2" fill="#fff"/><circle cx="150" cy="22" r="2" fill="#fff"/><circle cx="190" cy="40" r="2" fill="#fff"/>`;
  if (eco === "grassland") scene = `<rect y="126" width="220" height="26" fill="#B8913A" opacity=".6"/><path d="M6 140 l4 -30 M14 140 l-2 -26 M22 140 l6 -34 M180 140 l-4 -32 M190 140 l3 -28 M200 140 l-2 -36 M210 140 l5 -26" stroke="#9C7A24" stroke-width="3" stroke-linecap="round"/><circle cx="186" cy="24" r="12" fill="#FFF3C4"/>`;
  if (eco === "pond") scene = `<rect y="124" width="220" height="30" fill="#6E5A3C" opacity=".5"/><path d="M190 140 v-60 M200 140 v-48 M18 140 v-52" stroke="#2F6B3F" stroke-width="4" stroke-linecap="round"/><ellipse cx="190" cy="78" rx="4" ry="11" fill="#7A4E2A"/>`;
  if (sceneOnly) return `<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="width:100%;height:100%"><defs><linearGradient id="${id}bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient></defs><rect width="220" height="150" fill="url(#${id}bg)"/>${scene}</svg>`;
  // legs / tail / fins behind body
  if (shape === "fins") {
    p.push(`<path d="M${cx-rx+6} ${cy} L${cx-rx-26} ${cy-20} L${cx-rx-20} ${cy} L${cx-rx-26} ${cy+20} Z" fill="${accent}"/>`);
    p.push(`<path d="M${cx-14} ${cy-ry+4} Q${cx} ${cy-ry-24} ${cx+16} ${cy-ry+2} Z" fill="${accent}"/>`);
  } else if (shape) {
    const legY = cy + ry - 6, legLen = shape === "smallears" ? 26 : 16;
    [-0.6,-0.25,0.25,0.6].forEach(k => p.push(`<rect x="${cx + k*rx - 4}" y="${legY}" width="9" height="${legLen}" rx="4" fill="${accent}"/>`));
    if (hasX("widefeet")) [-0.6,-0.25,0.25,0.6].forEach(k => p.push(`<ellipse cx="${cx + k*rx + 2}" cy="${legY+legLen}" rx="10" ry="4" fill="${accent}"/>`));
    p.push(`<path d="M${cx-rx+4} ${cy} Q${cx-rx-22} ${cy-6} ${cx-rx-18} ${cy-24}" stroke="${accent}" stroke-width="7" fill="none" stroke-linecap="round"/>`);
  } else {
    p.push(`<path d="M${cx-rx+4} ${cy} Q${cx-rx-18} ${cy} ${cx-rx-14} ${cy-18}" stroke="${accent}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>`);
  }
  if (hasX("waterstore") && shape !== "fins") p.push(`<ellipse cx="${cx-8}" cy="${cy-ry+2}" rx="18" ry="12" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
  if (hasX("spines")) for (let k = -0.7; k <= 0.5; k += 0.24) { const x = cx + k*rx; const y = cy - ry*Math.sqrt(Math.max(0,1-k*k)) + 3; p.push(`<path d="M${x-6} ${y} L${x} ${y-16} L${x+6} ${y} Z" fill="${accent}"/>`); }
  if (shape === "smallears") {
    p.push(`<path d="M${cx+rx*0.3} ${cy-ry+8} L${cx+rx*0.15} ${cy-ry-34} L${cx+rx*0.65} ${cy-ry+2} Z" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
    p.push(`<path d="M${cx+rx*0.6} ${cy-ry+10} L${cx+rx*0.85} ${cy-ry-30} L${cx+rx*1.0} ${cy-ry+12} Z" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
  }
  if (shape === "large") p.push(`<circle cx="${cx+rx*0.45}" cy="${cy-ry+4}" r="9" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
  // body
  const strokeC = hasX("colorchange") ? `url(#${id}g)` : accent;
  p.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${strokeC}" stroke-width="${hasX("colorchange") ? 5 : 2.5}"/>`);
  // pattern inside body
  const inner = [];
  if (traits.color === "bright" && !hasX("pale")) for (let k = -0.7; k <= 0.7; k += 0.35) inner.push(`<rect x="${cx + k*rx - 5}" y="${cy-ry}" width="10" height="${ry*2}" fill="${accent}" opacity=".85"/>`);
  if (traits.color === "dark") [[-.4,-.2],[.1,.3],[-.1,-.4],[.35,-.1],[-.55,.3]].forEach(([a,b]) => inner.push(`<circle cx="${cx+a*rx}" cy="${cy+b*ry}" r="${ry*0.16}" fill="${accent}" opacity=".7"/>`));
  if (traits.color === "tan") [[-.4,-.1],[.0,.35],[.3,-.3],[-.15,-.45],[-.6,.25]].forEach(([a,b]) => inner.push(`<circle cx="${cx+a*rx}" cy="${cy+b*ry}" r="2.5" fill="${accent}" opacity=".7"/>`));
  if (traits.covering === "scales") for (let y = cy-ry; y < cy+ry; y += 9) for (let x = cx-rx + ((y/9)%2 ? 5 : 0); x < cx+rx; x += 10) inner.push(`<path d="M${x} ${y} a5 5 0 0 0 10 0" fill="none" stroke="${accent}" stroke-width="1.4" opacity=".55"/>`);
  if (hasX("toxin")) [[-.3,.4],[.2,.45],[-.6,-.1]].forEach(([a,b]) => inner.push(`<circle cx="${cx+a*rx}" cy="${cy+b*ry}" r="3.5" fill="#F3D21F" stroke="#7A5D00" stroke-width="1"/>`));
  p.push(`<g clip-path="url(#${id}clip)">${inner.join("")}</g>`);
  if (traits.covering === "fur") for (let a = 0; a < Math.PI*2; a += 0.22) { const x1 = cx + rx*Math.cos(a), y1 = cy + ry*Math.sin(a); const x2 = cx + (rx+8)*Math.cos(a+0.08), y2 = cy + (ry+8)*Math.sin(a+0.08); p.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${accent}" stroke-width="2.5" stroke-linecap="round"/>`); }
  if (traits.covering === "slimy") { p.push(`<ellipse cx="${cx-rx*0.25}" cy="${cy-ry*0.45}" rx="${rx*0.4}" ry="${ry*0.18}" fill="#fff" opacity=".6"/>`); p.push(`<ellipse cx="${cx+rx*0.3}" cy="${cy+ry+6}" rx="3" ry="5" fill="${fill}" opacity=".7"/>`); }
  if (shape === "fins") p.push(`<path d="M${cx+4} ${cy+6} Q${cx-8} ${cy+30} ${cx-22} ${cy+22} Z" fill="${accent}" opacity=".9"/>`);
  // face
  const ex = cx + rx*0.6, ey = cy - ry*0.22, er = hasX("bigeyes") ? 10 : 6.5;
  if (traits.breathing === "gills" || traits.breathing === "both") [0,7,14].forEach(d => p.push(`<path d="M${ex-16-d} ${ey-6} q-5 10 0 20" fill="none" stroke="${accent}" stroke-width="2.5" stroke-linecap="round"/>`));
  if (traits.breathing === "both" || traits.breathing === "lungs") p.push(`<circle cx="${cx+rx-4}" cy="${cy-2}" r="2" fill="${accent}"/>`);
  if (traits.breathing === "both") p.push(`<circle cx="${cx+rx+10}" cy="${cy-14}" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="${cx+rx+16}" cy="${cy-26}" r="3" fill="none" stroke="#fff" stroke-width="2"/>`);
  p.push(`<circle cx="${ex}" cy="${ey}" r="${er}" fill="#fff" stroke="${accent}" stroke-width="1.5"/><circle cx="${ex+er*0.3}" cy="${ey}" r="${er*0.5}" fill="#16303F"/>`);
  p.push(`<path d="M${cx+rx*0.7} ${cy+ry*0.3} q6 5 12 0" fill="none" stroke="#16303F" stroke-width="2" stroke-linecap="round"/>`);
  return `<svg viewBox="0 0 220 150" role="img" aria-label="Drawing of your species"><defs>
    <linearGradient id="${id}bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient>
    <linearGradient id="${id}g" x1="0" x2="1"><stop offset="0" stop-color="#E5484D"/><stop offset=".5" stop-color="#F5D547"/><stop offset="1" stop-color="#3E8EDE"/></linearGradient>
    <clipPath id="${id}clip"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath></defs>
    <rect width="220" height="150" fill="url(#${id}bg)"/>${scene}${p.join("")}</svg>`;
}

function ecoArt(eco){ return critterSVG({}, [], eco, true); }

function statusBar(){

function runGeneration(pred){
  const ev = state.events[state.gen];
  const f = fitScore();
  const g = clamp(1.12 + f*0.035, 0.3, 1.6);
  const matched = ev.mods.filter(m => has(m[0]));
  const e = clamp(ev.base + matched.reduce((a,m) => a + m[1], 0), 0.2, 1.45);
  const total = g * e * (0.95 + Math.random()*0.1);
  const old = state.pop;
  let next = total >= 1 ? old + old*(total-1)*Math.max(0, 1 - old/CAP) : old*total;
  next = Math.round(next); if (next < 2) next = 0;
  const grew = next > old;
  const correct = next === old ? true : (pred === "up") === grew;
  state.predictions++; if (correct) state.correct++;
  state.pop = next; state.gen++; state.history.push(next);
  state.journal.push(`Generation ${state.gen}: ${ev.title} (${ev.type.toLowerCase()}). Population ${old} → ${next}.`);
  if (next === 0) state.extinctGen = state.gen;
  state.last = { ev, f, g, e, matched, old, next, pred, correct };
  state.screen = "result"; render();
}

function viewResult(){
  const r = state.last, diff = r.next - r.old;
  const helps = r.matched.filter(m => m[1] > 0), hurts = r.matched.filter(m => m[1] < 0);
  let nextLabel, nextAction;
  if (state.pop === 0 || state.gen >= GENS) { nextLabel = "Read your field report"; nextAction = "end"; }
  else if (MUT_AFTER.includes(state.gen)) { nextLabel = "Check for new mutations"; nextAction = "mutate"; }
  else { nextLabel = `Start generation ${state.gen + 1}`; nextAction = "event"; }
  return `${statusBar()}
  <div class="play">
    <div>
      <h2>Generation ${state.gen}: ${r.ev.title}</h2>
      <div class="bignum">${r.old} → ${r.next} <span class="delta ${diff >= 0 ? "up" : "down"}" style="font-size:.5em">(${diff >= 0 ? "+" : "−"}${Math.abs(diff)})</span></div>
      <div class="popbar" aria-hidden="true"><i style="width:${(r.old/CAP*100).toFixed(1)}%" data-w="${(r.next/CAP*100).toFixed(1)}"></i></div>
      <p class="muted small">Population out of ${CAP} (the most this ecosystem can support)</p>
      <p class="note">${r.correct ? "✓ Your prediction was correct." : "✗ Your prediction didn’t match this time."} ${state.pop === 0 ? `${esc(speciesName())} has gone extinct.` : ""}</p>
      <div class="panel" style="margin-top:18px">
        <div class="factor-line"><span><b>Everyday survival</b><br><span class="muted small">Overall, your traits are ${fitWords(r.f)} for the ${ECOS[state.eco].name}.</span></span><span class="pct ${r.g >= 1 ? "up" : "down"}">${fmtPct(r.g - 1)}</span></div>
        <div class="factor-line"><span><b>${r.ev.title}</b><br><span class="muted small">How the ${r.ev.type.toLowerCase()} event affected this generation</span></span><span class="pct ${r.e >= 1 ? "up" : "down"}">${fmtPct(r.e - 1)}</span></div>
        <div class="factor-line"><span><b>Total change this generation</b><br><span class="muted small">Both effects combined, plus a little natural randomness</span></span><span class="pct ${diff >= 0 ? "up" : "down"}">${r.old ? fmtPct(diff / r.old) : "0%"}</span></div>
        <ul class="effects">
          ${helps.map(m => `<li class="help"><span class="icon" aria-label="helped">✓</span><span>${m[2]}</span></li>`).join("")}
          ${hurts.map(m => `<li class="hurt"><span class="icon" aria-label="hurt">✗</span><span>${m[2]}</span></li>`).join("")}
          ${!r.matched.length ? `<li><span>${r.ev.base > 1 ? (diff >= 0 ? "A good year for everyone! Your species’ everyday traits decided how much it could take advantage." : "Even in a year with plenty of food, your species’ everyday traits held it back. Food can’t make up for traits that don’t fit the ecosystem.") : "None of your traits made a special difference during this event."}</span></li>` : ""}
        </ul>
        ${(() => { const w = rankedTraits()[0]; return state.pop > 0 && w && w.score <= -3 ? `<div class="observe"><b>Field observation:</b> Researchers noticed your species struggling every day. They suspect one trait is a poor match for the ${ECOS[state.eco].name}: <b>${esc(w.name)}</b> (${w.label.toLowerCase()}). Which abiotic or biotic factor might explain that?</div>` : ""; })()}
      </div>
      <p style="margin-top:20px"><button class="btn" data-next="${nextAction}">${nextLabel}</button></p>
    </div>
    <aside>${specimen()}</aside>
  </div>`;
}

function makeOffer(){
  // one trait swap + one new trait (sometimes harmful)
  const t = pick(TRAITS);
  const opt = pick(t.options.filter(o => o.id !== state.traits[t.id]));
  const owned = state.extras;
  const harmfulPool = Object.keys(EXTRAS).filter(k => EXTRAS[k].harmful && !owned.includes(k));
  const goodPool = Object.keys(EXTRAS).filter(k => !EXTRAS[k].harmful && !owned.includes(k));
  const xid = (Math.random() < 0.3 && harmfulPool.length) || !goodPool.length ? pick(harmfulPool) : pick(goodPool);
  const opts = [{ kind:"swap", cat:t.id, to:opt.id }];
  if (xid) opts.push({ kind:"extra", id:xid });
  state.offer = shuffle(opts);
}

function viewMutate(){
  const cards = state.offer.map((o, k) => {
    if (o.kind === "swap") {
      const t = traitDef(o.cat), from = optDef(o.cat, state.traits[o.cat]), to = optDef(o.cat, o.to);
      return `<button class="mut-card" data-mut="${k}"><span class="tag ${t.type}">Changes a ${t.type.toLowerCase()} trait</span>
        <span class="mut-name">${t.label}: ${to.name}</span>
        <span class="swap">Replaces: ${from.name}</span><span>${to.desc}</span><span class="pick">Spread this variation</span></button>`;
    }
    const x = EXTRAS[o.id];
    return `<button class="mut-card" data-mut="${k}"><span class="tag ${x.type}">New ${x.type.toLowerCase()} trait</span>
      <span class="mut-name">${x.name}</span><span>${x.desc}</span><span class="pick">Spread this variation</span></button>`;
  }).join("");
  return `${statusBar()}
  <div class="play">
    <div>
      <h2>New genetic variations appeared</h2>
      <p>When organisms reproduce, small changes in DNA called <b>mutations</b> can create new traits. Two new variations showed up in your population. Some mutations help, some hurt, and some barely matter.</p>
      <p><b>Predict which variation will help your species survive in the ${ECOS[state.eco].name}.</b> The one you choose will spread through the population and affect every generation after this.</p>
      ${cheatSheet(false)}
      <div class="mut-grid">${cards}
        <button class="mut-card" data-mut="none"><span class="tag" style="background:var(--line)">No change</span>
          <span class="mut-name">Keep my species the same</span><span>Neither variation spreads. Your traits stay as they are.</span><span class="pick">Keep current traits</span></button>
      </div>
      <p class="aside-note small">In real life, nobody gets to choose. The environment does the “choosing”: individuals with helpful traits survive and have more offspring, so those traits become more common. That process is called natural selection.</p>
    </div>
    <aside>${specimen()}</aside>
  </div>`;
}

function applyMutation(k){
  if (k !== "none") {
    const o = state.offer[+k];
    if (o.kind === "swap") {
      const t = traitDef(o.cat), from = optDef(o.cat, state.traits[o.cat]).name, to = optDef(o.cat, o.to).name;
      state.traits[o.cat] = o.to;
      state.mutations.push(`${t.label} changed from ${from} to ${to}`);
      state.journal.push(`Mutation spread: ${t.label.toLowerCase()} changed from “${from}” to “${to}.”`);
    } else {
      state.extras.push(o.id);
      state.mutations.push(`Gained ${EXTRAS[o.id].name.toLowerCase()}`);
      state.journal.push(`Mutation spread: gained ${EXTRAS[o.id].name.toLowerCase()}.`);
    }
  } else state.journal.push("No new mutation spread this time.");
  state.offer = null; state.screen = "event"; render();
}

function outcome(){
  if (state.pop === 0) return { cls:"extinct", head:"Extinct", emoji:"💀", msg:`${esc(speciesName())} vanished in generation ${state.extinctGen}. Its traits didn’t match the ecosystem’s biotic and abiotic factors well enough to survive.` };
  if (state.pop >= 400) return { cls:"thriving", head:"Thriving", emoji:"🌟", msg:`${esc(speciesName())} is booming. Its adaptations are a strong fit for the ${ECOS[state.eco].name}.` };
  if (state.pop >= 100) return { cls:"surviving", head:"Surviving", emoji:"🌿", msg:`${esc(speciesName())} is holding on. Some traits helped, while others held the population back.` };
  return { cls:"endangered", head:"Endangered", emoji:"⚠️", msg:`${esc(speciesName())} is still alive, but barely. A few poor matches between its traits and its environment are dragging it down.` };
}

function chartSVG(){
  const h = state.history, W = 640, H = 240, L = 46, R = 16, T = 16, B = 36;
  const maxY = Math.max(200, ...h) * 1.1;
  const x = k => L + k*(W-L-R)/GENS, y = v => T + (H-T-B)*(1 - v/maxY);
  const pts = h.map((v,k) => `${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ticks = [0, Math.round(maxY/2/50)*50, Math.round(maxY/50)*50].filter((v,i,a) => a.indexOf(v) === i && v <= maxY);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of population over ${GENS} generations" style="min-width:480px">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${y(START)}" y2="${y(START)}" stroke="var(--muted)" stroke-dasharray="5 5"/>
    <text x="${W-R}" y="${y(START)-6}" text-anchor="end" font-size="12" fill="var(--muted)">starting population</text>
    ${Array.from({length:GENS+1},(_,k) => `<text x="${x(k)}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--muted)">${k === 0 ? "Start" : "G" + k}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    ${h.map((v,k) => `<circle cx="${x(k)}" cy="${y(v)}" r="5" fill="${v === 0 ? "var(--harm)" : "var(--mark)"}" stroke="var(--ink)" stroke-width="2"><title>${k === 0 ? "Start" : "Generation " + k}: ${v}</title></circle>`).join("")}
  </svg>`;
}

function verdict(score){ return score >= 2 ? ["help","Helped"] : score <= -1 ? ["hurt","Hurt"] : ["meh","Mixed"]; }

function reportRows(){
  const i = ecoIndex(); const rows = [];
  TRAITS.forEach(t => { const o = optDef(t.id, state.traits[t.id]); const [c,l] = verdict(o.s[i]);
    rows.push({ name:o.name, label:t.label, type:t.type, c, l, why:o.why[i] }); });
  state.extras.forEach(x => { const d = EXTRAS[x]; const [c,l] = verdict(d.s[i]);
    const why = d.harmful ? (c === "hurt" ? `${d.desc} This mutation hurts survival in almost every ecosystem.` : `${d.desc} This mutation hurts in most ecosystems, but pale coloring blends in with snow here, so it didn’t hurt much.`) : c === "help" ? `${d.desc} That fits the challenges of the ${ECOS[state.eco].name}.` : c === "hurt" ? `${d.desc} That works against the conditions here.` : `${d.desc} It helped only during certain events.`;
    rows.push({ name:d.name, label:"Mutation", type:d.type, c, l, why }); });
  return rows;
}

function fieldReportText(o, rows){
  const e = ECOS[state.eco];
  return [`ADAPT OR VANISH: FIELD REPORT`, `Species: ${speciesName()}`, `Ecosystem: ${e.name} (${e.kind})`,
    `Result: ${o.head}, final population ${state.pop}`, `Predictions correct: ${state.correct} of ${state.predictions}`, ``,
    `Traits:`, ...rows.map(r => `- ${r.name} (${r.type}, ${r.label}): ${r.l}. ${r.why}`), ``,
    `Journal:`, ...state.journal.map(j => `- ${j}`)].join("\n");
}

function viewEnd(){
  const o = outcome(), rows = reportRows(), i = ecoIndex(), e = ECOS[state.eco];
  return `<section class="outcome ${o.cls}">
      <div class="row" style="align-items:flex-start; gap:24px">
        <div style="flex:1 1 320px">
          <h2 style="margin-bottom:.2em">Field report: ${esc(speciesName())}</h2>
          <div class="bignum">${o.emoji} ${o.head}</div>
          <p style="margin-top:12px; font-size:1.15rem">${o.msg}</p>
          <p class="muted">Final population: <b>${state.pop}</b>. Predictions correct: <b>${state.correct} of ${state.predictions}</b></p>
        </div>
        <div style="flex:0 1 280px; width:100%">${specimen()}</div>
      </div>
    </section>

    <div class="section"><h3>Population over time</h3><div class="chart-wrap panel">${chartSVG()}</div></div>

    <div class="section"><h3>Trait report card</h3>
      <p class="muted">How each adaptation matched the abiotic and biotic factors of the ${e.name}.</p>
      ${(() => { const rk = rankedTraits(), worst = rk[0], best = rk[rk.length - 1]; return `<div class="callouts"><div class="panel"><span class="verdict help">✓ Biggest advantage</span><b>${esc(best.name)}</b><span class="muted small">${best.label}</span></div><div class="panel"><span class="verdict ${worst.score < 0 ? "hurt" : "meh"}">${worst.score < 0 ? "✗ Biggest problem" : "~ Weakest trait"}</span><b>${esc(worst.name)}</b><span class="muted small">${worst.label}</span></div></div>`; })()}
      <div class="table-wrap panel"><table class="report">
        <thead><tr><th>Trait</th><th>Type</th><th>Result</th><th>Why</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td><b>${esc(r.name)}</b><br><span class="muted small">${r.label}</span></td><td><span class="tag ${r.type}">${r.type}</span></td><td class="verdict ${r.c}">${r.c === "help" ? "✓" : r.c === "hurt" ? "✗" : "~"} ${r.l}</td><td>${esc(r.why)}</td></tr>`).join("")}</tbody>
      </table></div>
      <details class="ideal panel"><summary>Reveal the best-adapted traits for the ${e.name}</summary>
        <ul>${TRAITS.map(t => { const best = [...t.options].sort((a,b) => b.s[i] - a.s[i])[0]; return `<li><b>${t.label}:</b> ${best.name}. ${best.why[i]}</li>`; }).join("")}</ul>
        <p class="muted small" style="margin:0">Notice that the best traits here would be poor choices in a different ecosystem. Try another one and compare!</p>
      </details>
    </div>

    <div class="section"><h3>Expedition journal</h3><ol class="journal">${state.journal.map(j => `<li>${esc(j)}</li>`).join("")}</ol></div>

    <div class="section"><h3>Think like a scientist</h3>
      <ol class="journal">
        <li>Choose one <b>physical adaptation</b> your species had. Which abiotic or biotic factor in the ${e.name} made it helpful or harmful?</li>
        <li>Choose one <b>behavioral adaptation</b>. How did it change your species’ chances during one specific event?</li>
        <li>Imagine moving your species to a different ecosystem. Which trait would hurt it the most there, and why?</li>
        <li>Explain why a trait that is an advantage in one ecosystem can be a disadvantage in another.</li>
      </ol>
    </div>

    <div class="section"><h3>Copy your results</h3>
      <p class="muted">Paste this into your assignment or science notebook.</p>
      <textarea class="report-text" id="reportText" readonly>${esc(fieldReportText(o, rows))}</textarea>
      <p class="row" style="margin-top:10px"><button class="btn-ghost" id="copy">Copy report</button><span id="copyMsg" class="muted small" role="status"></span></p>
    </div>

    <div class="section row">
      <button class="btn" id="again">Try the ${e.name} again</button>
      <button class="btn-ghost" id="newEco">Choose a new ecosystem</button>
    </div>`;
}

/* ---------- event binding ---------- */
const bind = {
  title(){ $("#go").onclick = () => { state.screen = "eco"; render(); }; },
  eco(){ document.querySelectorAll("[data-eco]").forEach(b => b.onclick = () => { const n = state.name; state = freshState(b.dataset.eco); state.name = n; render(); }); },
  design(){
    const refresh = () => {
      $("#spec").innerHTML = specimen();
      const left = TRAITS.filter(t => !state.traits[t.id]).length;
      $("#release").disabled = left > 0;
      $("#remaining").textContent = left ? `${left} trait${left > 1 ? "s" : ""} left to choose` : "Ready! Choices are locked in once you release.";
    };
    document.querySelectorAll(".opts input").forEach(inp => inp.onchange = () => { state.traits[inp.name] = inp.value; refresh(); });
    $("#sname").oninput = ev => { state.name = ev.target.value; $("#spec .critter-cap h3").textContent = speciesName(); };
    $("#back").onclick = () => { state.screen = "eco"; render(); };
    $("#release").onclick = () => {
      state.events = shuffle(EVENTS[state.eco]).slice(0, GENS);
      state.journal.push(`Released ${speciesName()} into the ${ECOS[state.eco].name} with ${START} individuals.`);
      state.screen = "event"; render();
    };
  },
  event(){ document.querySelectorAll("[data-pred]").forEach(b => b.onclick = () => runGeneration(b.dataset.pred)); },
  result(){
    const bar = document.querySelector(".popbar i");
    if (bar) requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = bar.dataset.w + "%"));
    $("[data-next]").onclick = ev => {
      const a = ev.currentTarget.dataset.next;
      if (a === "mutate") makeOffer();
      state.screen = a; render();
    };
  },
  mutate(){ document.querySelectorAll("[data-mut]").forEach(b => b.onclick = () => applyMutation(b.dataset.mut)); },
  end(){
    $("#again").onclick = () => { const n = state.name, eco = state.eco; state = freshState(eco); state.name = n; render(); };
    $("#newEco").onclick = () => { const n = state.name; state = freshState(); state.name = n; state.screen = "eco"; render(); };
    $("#copy").onclick = async () => {
      const ta = $("#reportText");
      try { await navigator.clipboard.writeText(ta.value); $("#copyMsg").textContent = "Copied!"; }
      catch (err) { ta.focus(); ta.select(); try { document.execCommand("copy"); $("#copyMsg").textContent = "Copied!"; } catch (e2) { $("#copyMsg").textContent = "Text selected. Press Ctrl+C (or ⌘+C) to copy."; } }
    };
  }
};

/* glossary */
$("#glossList").innerHTML = GLOSSARY.map(([t,d]) => `<dt>${t}</dt><dd>${d}</dd>`).join("");
$("#openGlossary").onclick = () => { const d = $("#glossary"); if (d.showModal) d.showModal(); else d.setAttribute("open",""); };
$("#closeGlossary").onclick = () => { const d = $("#glossary"); if (d.close) d.close(); else d.removeAttribute("open"); };
$("#glossary").addEventListener("click", ev => { if (ev.target.id === "glossary") ev.target.close(); });

render();
</script>
</body>
</html>
